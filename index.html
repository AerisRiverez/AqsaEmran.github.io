<h1 style="color: white;">Until Second Semester</h1>
<h2 style="color: white;", id="countdown">Loading countdown...</h2>

<script>
  const targetDate = new Date("2027-02-03T00:00:00").getTime();

  const timer = setInterval(() => {
    const now = new Date().getTime();
    const distance = targetDate - now;

    const days = Math.floor(distance / (1000 * 60 * 60 * 24));
    const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
    const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
    const seconds = Math.floor((distance % (1000 * 60)) / 1000);

    // Fixed backticks around the output string
    document.getElementById("countdown").textContent = 
      `${days}d ${hours}h ${minutes}m ${seconds}s`;

    if (distance < 0) {
      clearInterval(timer);
      document.getElementById("countdown").textContent = "Event has arrived!";
    }
  }, 1000);
</script>
